# craft-cloud.yaml
# Valid Craft Cloud configuration file

name: Sample Craft Plugin
handle: sample-craft-plugin
type: plugin
schemaVersion: 1.0.0
php: 8.2  # ✅ Required field

environments:
  production:
    baseUrl: "https://example.com"
    database:
      driver: mysql
      server: 127.0.0.1
      user: root
      password: secret
      database: craft_cloud_prod
    redis:
      hostname: 127.0.0.1
      port: 6379
      password: null
  staging:
    baseUrl: "https://staging.example.com"
    database:
      driver: mysql
      server: 127.0.0.1
      user: root
      password: secret
      database: craft_cloud_staging

craft:
  timezone: "Asia/Kolkata"
  cpTrigger: "admin"
  securityKey: "base64:ReplaceThisWithRealKey"

plugin:
  name: "Sample Craft Plugin"
  description: "A sample plugin demonstrating Craft Cloud configuration."
  developer: "testtest"
  developerUrl: "https://github.com/testtest/sample-craft-plugin"
  documentationUrl: "https://github.com/testtest/sample

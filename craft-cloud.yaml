# craft-cloud.yaml
# Example configuration file for Craft Cloud

name: Sample Craft Plugin
handle: sample-craft-plugin
type: plugin
schemaVersion: 1.0.0

# The environment where this plugin will be deployed
environments:
  production:
    baseUrl: "https://example.com"
    database:
      driver: mysql
      server: 127.0.0.1
      user: root
      password: secret
      database: craft_cloud_prod
    redis:
      hostname: 127.0.0.1
      port: 6379
      password: null
  staging:
    baseUrl: "https://staging.example.com"
    database:
      driver: mysql
      server: 127.0.0.1
      user: root
      password: secret
      database: craft_cloud_staging

# Optional Craft settings
craft:
  timezone: "Asia/Kolkata"
  cpTrigger: "admin"
  securityKey: "base64:ReplaceThisWithRealKey"

# Plugin metadata for display in Craft Cloud
plugin:
  name: "Sample Craft Plugin"
  description: "A sample plugin demonstrating Craft Cloud configuration."
  developer: "testtest"
  developerUrl: "https://github.com/testtest/sample-craft-plugin"
  documentationUrl: "https://github.com/testtest/sample-craft-plugin/README.md"
  changelogUrl: "https://github.com/testtest/sample-craft-plugin/CHANGELOG.md"

# Deployment settings
deployment:
  autoMigrate: true
  backupBeforeDeploy: true
  syncAssets: true
  clearCachesAfterDeploy: true

# craft-cloud.yaml
# Strictly valid Craft Cloud config (no inline YAML errors)

name: "Sample Craft Plugin"
handle: "sample-craft-plugin"
type: "plugin"
schemaVersion: "1.0.0"

php:
  version: "8.2"

environments:
  production:
    baseUrl: "https://example.com"
    database:
      driver: "mysql"
      server: "127.0.0.1"
      user: "root"
      password: "secret"
      database: "craft_cloud_prod"
    redis:
      hostname: "127.0.0.1"
      port: 6379
      password: null
  staging:
    baseUrl: "https://staging.example.com"
    database:
      driver: "mysql"
      server: "127.0.0.1"
      user: "root"
      password: "secret"
      database: "craft_cloud_staging"

craft:
  timezone: "Asia/Kolkata"
  cpTrigger: "admin"
  securityKey: "base64:ReplaceThisWithRealKey"

plugin:
  name: "Sample Craft Plugin"
  description: "A sample plugin demonstrating Craft Cloud configuration."
  developer: "testtest"
  developerUrl: "https://github.com/testtest/sample-craft-plugin"
  documentationUrl: "https://github.com/testtest/sample-craft-plugin/blob/main/README.md"
  changelogUrl: "https://github.com/testtest/sample-craft-plugin/blob/main/CHANGELOG.md"

deployment:
  autoMigrate: true
  backupBeforeDeploy: true
  syncAssets: true
  clearCachesAfterDeploy: true
